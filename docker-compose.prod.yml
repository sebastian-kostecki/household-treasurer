services:
    app:
        build:
            context: .
            dockerfile: docker/8.5/Dockerfile.prod
            args:
                WWWGROUP: ${WWWGROUP:-1000}
                VITE_APP_NAME: ${VITE_APP_NAME:-Domowy Skarbnik}
                POSTGRES_VERSION: 18
        image: household-treasurer-app:prod
        container_name: treasurer-app
        restart: unless-stopped
        # Caps so a runaway import or request cannot take the memory of the other apps and
        # Vaultwarden on the shared VPS (same limits as root-keeper).
        mem_limit: 1g
        cpus: 1.0
        pids_limit: 256
        environment:
            WWWUSER: ${WWWUSER:-1000}
            SUPERVISOR_PHP_USER: sail
        volumes:
            - ./storage:/var/www/html/storage
            - ${BACKUP_HOST_DIR:-/storage/household-treasurer-backups}:/var/www/html/storage/app/backups
            - ./.env.prod:/var/www/html/.env:ro
        networks:
            - treasurer-internal
            # Shared only with Traefik (kostecki-dev-infra), no internet; the app reaches the
            # internet (mail) through its own network above.
            - proxy-treasurer
        depends_on:
            pgsql:
                condition: service_healthy
        labels:
            - traefik.enable=true
            - traefik.docker.network=proxy-treasurer
            - traefik.http.routers.treasurer.rule=Host(`budget.kostecki.dev`)
            - traefik.http.routers.treasurer.entrypoints=websecure
            - traefik.http.routers.treasurer.tls.certresolver=letsencrypt
            # Security headers shared by the apps: kostecki-dev-infra traefik/dynamic/app-security.yml
            - traefik.http.routers.treasurer.middlewares=app-security@file
            - traefik.http.services.treasurer.loadbalancer.server.port=80
            # Old address treasurer.kostecki.dev: permanent redirect, path and query kept (301 GET, 308 POST).
            - traefik.http.routers.treasurer-old.rule=Host(`treasurer.kostecki.dev`)
            - traefik.http.routers.treasurer-old.entrypoints=websecure
            - traefik.http.routers.treasurer-old.tls.certresolver=letsencrypt
            - traefik.http.routers.treasurer-old.service=treasurer
            - traefik.http.routers.treasurer-old.middlewares=treasurer-old-host
            - traefik.http.middlewares.treasurer-old-host.redirectregex.regex=^https?://treasurer\.kostecki\.dev/(.*)
            - traefik.http.middlewares.treasurer-old-host.redirectregex.replacement=https://budget.kostecki.dev/$${1}
            - traefik.http.middlewares.treasurer-old-host.redirectregex.permanent=true

    pgsql:
        image: postgres:18-alpine
        container_name: treasurer-pgsql
        restart: unless-stopped
        mem_limit: 512m
        cpus: 0.5
        pids_limit: 128
        environment:
            PGPASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - treasurer-pgsql:/var/lib/postgresql
        networks:
            - treasurer-internal
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -q -d ${DB_DATABASE} -U ${DB_USERNAME}',
                ]
            retries: 5
            timeout: 5s
            interval: 10s

networks:
    treasurer-internal:
        driver: bridge
    proxy-treasurer:
        external: true

volumes:
    treasurer-pgsql:
