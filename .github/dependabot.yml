version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    # Packages that must move together get one PR: @unovis/vue pins @unovis/ts to its own
    # version (a bump of one alone fails npm ci with ERESOLVE), and the platform builds of
    # rollup should stay on the same version.
    groups:
      unovis:
        patterns:
          - "@unovis/*"
      rollup-platform-builds:
        patterns:
          - "@rollup/rollup-*"
